# ==============================================================================
# OpenNVR — Standalone Fall Detection System (AI Adapter + Monitoring App)
# ==============================================================================
# STANDALONE mode: includes its own NATS broker so this stack can run
# independently of the full OpenNVR core stack.
#
# Run from inside fall_detection_adapter/:
#
#   1. Set the internal API key:
#        export INTERNAL_API_KEY=your_key_here        (Linux/macOS)
#        set INTERNAL_API_KEY=your_key_here           (Windows cmd)
#        $env:INTERNAL_API_KEY="your_key_here"        (PowerShell)
#
#   2. Build and launch:
#        docker compose up -d --build
#
# NOTE: Both 'opennvr_internal' and 'opennvr_apps' external networks must
# exist before starting. Create them with:
#   docker network create opennvr_internal
#   docker network create opennvr_apps
#
# The fall-detection-register service polls opennvr-core:8100 (KAI-C) to
# auto-register the adapter. In standalone mode (no OpenNVR core), it will
# retry 40 times then exit gracefully — register manually via the UI.
#
# For use WITH the full OpenNVR stack, prefer docker-compose.fall.yml as an
# overlay: docker compose -f <opennvr>/docker-compose.yml -f docker-compose.fall.yml up -d
# ==============================================================================

services:
  # ── 0. NATS message broker (standalone mode — not needed when using the full OpenNVR stack) ──
  nats:
    image: nats:2.10-alpine
    container_name: opennvr_nats_standalone
    restart: unless-stopped
    command: ["--auth", "${INTERNAL_API_KEY}"]
    ports:
      - "4222:4222"
    networks:
      - opennvr_internal
      - opennvr_apps
    healthcheck:
      test: ["CMD", "nats-server", "--help"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ── 1. Fall Detection AI Adapter (GPU Accelerated) ─────────────────────────
  fall-detection-adapter:
    build:
      context: ./adapter
      dockerfile: Dockerfile
    image: opennvr/fall-detection-adapter:1.0.0
    container_name: opennvr_fall_detection_adapter
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - OPENNVR_ADAPTER_TOKEN=${INTERNAL_API_KEY}
      - YOLO_POSE_WEIGHTS_DIR=/weights
      - YOLO_POSE_WEIGHTS_PATH=/weights/yolo26n-pose.pt
      - FALL_TRANSFORMER_TFLITE_PATH=/weights/fall_detection_transformer.tflite
    volumes:
      # Mount the local weights directly from fall_detection/
      - ./fall_detection:/weights:ro
    ports:
      - "9010:9010"
    networks:
      - opennvr_internal
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx, sys; sys.exit(0 if httpx.get('http://127.0.0.1:9010/health', timeout=2).status_code == 200 else 1)"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5

  # ── 2. One-shot Adapter Auto-Registration with OpenNVR Core (KAI-C) ────────
  fall-detection-register:
    image: alpine:3.20
    container_name: opennvr_fall_detection_register
    restart: "no"
    depends_on:
      fall-detection-adapter:
        condition: service_healthy
    networks:
      - opennvr_internal
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
    command:
      - sh
      - -c
      - |
        set -e
        name="fall-detection"
        url="http://fall-detection-adapter:9010"
        echo "Attempting to auto-register '$$name' -> $$url with OpenNVR Core (KAI-C)..."
        i=0
        while [ $$i -lt 40 ]; do
          if wget -q -O- \
               --header="Content-Type: application/json" \
               --header="X-Internal-Api-Key: $${INTERNAL_API_KEY}" \
               --post-data="{\"name\":\"$$name\",\"url\":\"$$url\"}" \
               http://opennvr-core:8100/api/v1/adapters/register >/dev/null 2>&1; then
            echo "Successfully registered adapter '$$name' with OpenNVR!"
            wget -q -O- \
                 --header="X-Internal-Api-Key: $${INTERNAL_API_KEY}" \
                 --post-data="" \
                 "http://opennvr-core:8100/api/v1/adapters/$$name/permissions/approve-all" >/dev/null 2>&1 || true
            exit 0
          fi
          i=$$((i+1))
          echo "Waiting for opennvr-core:8100 to accept registration ($$i/40)..."
          sleep 3
        done
        echo "WARN: Timed out auto-registering. You can register it in the OpenNVR UI: Settings -> AI Models" >&2
        exit 0

  # ── 3. Fall Detection Monitoring App ───────────────────────────────────────
  fall-detection-app:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: opennvr/fall-detection-app:1.0.0
    container_name: opennvr_fall_detection_app
    restart: unless-stopped
    depends_on:
      nats:
        condition: service_healthy
      fall-detection-adapter:
        condition: service_healthy
    environment:
      - OPENNVR_INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - NATS_URL=nats://nats:4222
      - OPENNVR_URL=http://opennvr-core:8000
      # Internal MediaMTX address reachable from inside Docker (for HLS proxy).
      - MEDIAMTX_INTERNAL_URL=${MEDIAMTX_INTERNAL_URL:-http://mediamtx:8189}
    volumes:
      - ./app/config.docker.yml:/app/config.yml:ro
    ports:
      - "9210:9210"
    networks:
      - opennvr_apps
      - opennvr_internal
      - opennvr_default

networks:
  opennvr_internal:
    external: true
    name: open-nvr_opennvr_internal
  opennvr_apps:
    external: true
    name: open-nvr_opennvr_apps
  opennvr_default:
    external: true
    name: open-nvr_default