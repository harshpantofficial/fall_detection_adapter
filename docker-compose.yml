# ==========================================
# Fall detection for OpenNVR — a standalone add-on stack
# ==========================================
# Two containers that plug into a RUNNING OpenNVR stack the same way its
# own apps and adapters do, over its Docker networks:
#
#   fall-detection-adapter   YOLO26-pose + the fall transformer (both models
#                            baked into the image). Registered with OpenNVR's
#                            KAI-C as "fall-detection".
#   fall-detection           The app: watches the cameras you pick for it in
#                            the App Catalog, raises "Person fallen" alarms,
#                            draws its boxes on the Live View.
#
# Nothing in the OpenNVR checkout changes, and OpenNVR does not need to be
# restarted. Remove it with `docker compose down`.
#
#   1. copy .env.example to .env and set INTERNAL_API_KEY (the SAME value
#      as OpenNVR's .env) and OPENNVR_PROJECT (see .env.example)
#   2. put the two model files in ./models (see README)
#   3. docker compose up -d --build
#
# Test cameras from video files (optional): --profile testcam, see README.
# ==========================================

name: opennvr-fall-detection

services:
  fall-detection-adapter:
    build:
      context: .
      dockerfile: adapter/Dockerfile
    image: ${FALL_DETECTION_ADAPTER_IMAGE:-opennvr/fall-detection-adapter:local}
    container_name: opennvr_fall_detection_adapter
    restart: unless-stopped
    environment:
      # KAI-C calls adapters with the deployment's internal key.
      - OPENNVR_ADAPTER_TOKEN=${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env (same as OpenNVR's)}
      # The reference model's settings — see the README before changing:
      # 448 px moves fall onset by up to seven frames.
      - FALL_POSE_IMGSZ=${FALL_POSE_IMGSZ:-640}
      - FALL_POSE_CONF=${FALL_POSE_CONF:-0.25}
      - FALL_THRESHOLD=${FALL_THRESHOLD:-0.90}
    networks:
      # Where KAI-C (opennvr-core:8100) reaches adapters.
      opennvr_internal:
        aliases: [fall-detection-adapter]
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx, sys; sys.exit(0 if httpx.get('http://127.0.0.1:9013/health', timeout=2).status_code == 200 else 1)"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 20

  # One-shot: tell KAI-C the adapter exists and grant its declared
  # permissions — the same job OpenNVR's own *-register services do.
  # Re-run it any time with `docker compose up fall-detection-register`.
  fall-detection-register:
    image: alpine:3.20
    container_name: opennvr_fall_detection_register
    restart: "no"
    depends_on:
      fall-detection-adapter:
        condition: service_healthy
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
    command:
      - sh
      - -c
      - |
        set -e
        name="fall-detection"
        url="http://fall-detection-adapter:9013"
        echo "Registering '$$name' -> $$url with KAI-C (opennvr-core:8100)..."
        i=0
        while [ $$i -lt 60 ]; do
          if wget -q -O- \
               --header="Content-Type: application/json" \
               --header="X-Internal-Api-Key: $${INTERNAL_API_KEY}" \
               --post-data="{\"name\":\"$$name\",\"url\":\"$$url\"}" \
               http://opennvr-core:8100/api/v1/adapters/register >/dev/null 2>&1; then
            echo "Registered '$$name'."
            if wget -q -O- \
                 --header="X-Internal-Api-Key: $${INTERNAL_API_KEY}" \
                 --header="X-Actor: install" \
                 --post-data="" \
                 "http://opennvr-core:8100/api/v1/adapters/$$name/permissions/approve-all" >/dev/null 2>&1; then
              echo "Approved '$$name' declared permissions."
            else
              echo "WARN: could not approve '$$name' permissions - grant them on the AI models page." >&2
            fi
            exit 0
          fi
          i=$$((i+1)); echo "attempt $$i/60 failed (is OpenNVR running, and INTERNAL_API_KEY the same?); retry in 5s"; sleep 5
        done
        echo "ERROR: could not register '$$name' with KAI-C." >&2
        exit 1
    networks:
      - opennvr_internal

  fall-detection:
    build:
      context: .
      dockerfile: app/Dockerfile
    image: ${FALL_DETECTION_IMAGE:-opennvr/fall-detection:local}
    container_name: opennvr_fall_detection
    restart: unless-stopped
    depends_on:
      fall-detection-adapter:
        condition: service_healthy
      fall-detection-register:
        condition: service_completed_successfully
    environment:
      - OPENNVR_INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - OPENNVR_URL=http://opennvr-core:8000
      - KAIC_URL=http://opennvr-core:8100
      - NATS_ALERTS_URL=nats://nats-apps:4222
      # The apps network has no route out; nothing here needs one.
      - NO_PROXY=opennvr-core,nats,nats-apps,egress-proxy,mediamtx,localhost,127.0.0.1
    expose:
      - "9212"
    networks:
      # Where OpenNVR apps live: core, the apps bus and MediaMTX reach it
      # (and it them) as "fall-detection".
      opennvr_apps:
        aliases: [fall-detection]

  # ── Test cameras from video files (opt-in: --profile testcam) ──
  # Every file in ./test-videos becomes a looping RTSP camera at
  # rtsp://${TESTCAM_IP}:8554/<file name>, on OpenNVR's internal network.
  # Register them as OpenNVR cameras with testcam/register_test_cameras.py
  # (README). Plaintext, no auth, internal network only — a test rig.
  fall-testcam:
    profiles: [testcam]
    image: bluenviron/mediamtx:1.15.4-ffmpeg
    container_name: opennvr_fall_testcam
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/opt/fakecams/entrypoint.sh"]
    environment:
      - FAKECAM_VIDEO_DIR=/videos
      # Re-encode with clean keyframes at every loop seam.
      - FAKECAM_MODE=transcode
      - FAKECAM_FPS=${TESTCAM_FPS:-}
      # Each video is its own camera.
      - FAKECAM_GROUP=file
      - FAKECAM_SCAN_INTERVAL=5
    volumes:
      - ./testcam/entrypoint.sh:/opt/fakecams/entrypoint.sh:ro
      - ./test-videos:/videos:ro
    networks:
      opennvr_internal:
        # Static, because an OpenNVR camera stores an IP address. Inside
        # OpenNVR's internal subnet (default 172.28.0.0/16), away from
        # OpenNVR's own fake-camera rig (172.28.90.10).
        ipv4_address: ${TESTCAM_IP:-172.28.90.20}
        aliases: [fall-testcam]
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8554"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# OpenNVR's own networks, joined from outside. Compose names them
# <project>_opennvr_internal / <project>_opennvr_apps, where <project> is
# OpenNVR's compose project — the name of its checkout folder unless it
# was started with -p. `docker network ls` shows the real names.
networks:
  opennvr_internal:
    external: true
    name: ${OPENNVR_PROJECT:-open-nvr}_opennvr_internal
  opennvr_apps:
    external: true
    name: ${OPENNVR_PROJECT:-open-nvr}_opennvr_apps
