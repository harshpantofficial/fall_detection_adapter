# Fall detection — baked into the image. Connection settings and the key
# come from the environment (docker-compose.yml / .env); the alarm and
# video settings below are live-editable in the App Catalog form.

# Alarm
threshold: 0.90          # the model's validated threshold
cooldown_s: 10.0         # one fall = one alarm
min_hits: 1              # hot frames in a row before alarming
alert_severity: "critical"
attach_snapshot: true

# Video
fps: 10.0                # 10-15 measured to work; the model was trained on 24-30
frame_width: 640
hold_s: 5.0              # seconds FALLEN stays on the live view

webhook_url: null

contract_port: 9212
contract_bind_host: "0.0.0.0"
contract_host: "fall-detection"
opennvr_url: "http://opennvr-core:8000"
